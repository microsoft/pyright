packages:
  - 'packages/*'

lockfileIncludeTarballUrl: false
strictDepBuilds: false
# The pyrx root workspace installs these packages; don't start a second install before scripts.
verifyDepsBeforeRun: false
allowBuilds:
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true
  nx: true
  unrs-resolver: true

overrides:
  tar: '7.5.11'
  nx: '22.7.8'
  '@nx/devkit': '22.7.8'
  ip-address: '10.4.0'
