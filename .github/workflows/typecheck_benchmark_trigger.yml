name: Trigger type checker benchmark

on:
  issue_comment:
    types:
      - created
  workflow_run:
    workflows:
      - Validation
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  trigger:
    name: Authorize benchmark
    if: >-
      ${{ github.repository == 'microsoft/pyright' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/benchmark'))) }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
      checks: write
    runs-on: ubuntu-latest
    concurrency:
      group: pr-follow-up-Type checker benchmark-${{ github.event.workflow_run.head_sha || github.event.issue.number }}
      cancel-in-progress: false
    outputs:
      pr-number: ${{ steps.resolve.outputs.pr-number }}
      head-sha: ${{ steps.resolve.outputs.head-sha }}
      base-sha: ${{ steps.resolve.outputs.base-sha }}
      merge-sha: ${{ steps.resolve.outputs.merge-sha }}
      check-id: ${{ steps.resolve.outputs.check-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve benchmark revisions
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            let issueNumber
            if (context.eventName === 'workflow_run') {
              const resolve = require('./build/resolveValidatedPullRequest.js')
              const validated = await resolve({ github, context, core })
              if (!validated) return
              const { pullRequest, files } = validated
              issueNumber = pullRequest.number
              if (!files.some((file) => file.filename.startsWith('packages/pyright-internal/src/analyzer/'))) {
                const report = require('./build/reportPullRequestCheck.js')
                await report({
                  github, context, name: 'Type checker benchmark', headSha: pullRequest.head.sha,
                  status: 'completed', conclusion: 'skipped',
                  summary: 'Not run because the pull request does not change analyzer sources.',
                })
                core.notice('The pull request does not change analyzer sources')
                return
              }
            } else {
              if (context.payload.comment.body.trim() !== '/benchmark') {
                core.notice('The benchmark command must be the entire comment')
                return
              }

              const permission = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor,
              })
              const allowedPermissions = new Set(['admin', 'maintain', 'write'])
              if (!allowedPermissions.has(permission.data.permission)) {
                core.notice(`${context.actor} does not have permission to run the benchmark`)
                return
              }
              issueNumber = context.issue.number
            }

            const pullRequest = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issueNumber,
            })
            if (
              context.eventName === 'workflow_run' &&
              pullRequest.data.head.sha !== context.payload.workflow_run.head_sha
            ) {
              core.notice('The pull request changed after Validation')
              return
            }
            if (pullRequest.data.state !== 'open' && !pullRequest.data.merged) {
              core.notice('Only open or merged pull requests can be benchmarked')
              return
            }
            if (context.eventName === 'issue_comment') {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'validation.yml',
                event: 'pull_request',
                head_sha: pullRequest.data.head.sha,
                status: 'success',
                per_page: 100,
              })
              if (!runs.some((run) => run.head_sha === pullRequest.data.head.sha)) {
                core.notice('Wait for successful Validation before requesting a benchmark')
                return
              }
            }
            const report = require('./build/reportPullRequestCheck.js')
            const checkId = await report({
              github, context, name: 'Type checker benchmark', headSha: pullRequest.data.head.sha,
              status: 'in_progress', summary: 'Running analyzer benchmarks after successful Validation.',
            })
            core.setOutput('check-id', checkId)
            const candidateSha = pullRequest.data.merge_commit_sha
            if (!candidateSha) {
              core.setFailed('The pull request does not have a candidate commit to benchmark')
              return
            }
            const candidateCommit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: candidateSha,
            })
            const baseSha = candidateCommit.data.parents[0]?.sha
            if (!baseSha) {
              core.setFailed('The candidate commit does not have a first parent')
              return
            }
            if (
              !pullRequest.data.merged &&
              candidateCommit.data.parents[1]?.sha !== pullRequest.data.head.sha
            ) {
              core.setFailed('The pull request merge commit does not use the current head')
              return
            }
            core.setOutput('pr-number', issueNumber)
            core.setOutput('head-sha', pullRequest.data.head.sha)
            core.setOutput('base-sha', baseSha)
            core.setOutput('merge-sha', candidateSha)

  benchmark:
    name: Run benchmark
    needs: trigger
    if: ${{ needs.trigger.outputs.pr-number != '' }}
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
      pull-requests: write
    uses: ./.github/workflows/typecheck_benchmark_pr.yml
    with:
      pr_number: ${{ needs.trigger.outputs.pr-number }}
      head_sha: ${{ needs.trigger.outputs.head-sha }}
      base_sha: ${{ needs.trigger.outputs.base-sha }}
      merge_sha: ${{ needs.trigger.outputs.merge-sha }}

  report:
    name: Report benchmark check
    needs: [trigger, benchmark]
    if: ${{ always() && needs.trigger.outputs.check-id != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECK_ID: ${{ needs.trigger.outputs.check-id }}
          TRIGGER_RESULT: ${{ needs.trigger.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
        with:
          script: |
            const report = require('./build/reportPullRequestCheck.js')
            const results = [process.env.TRIGGER_RESULT, process.env.BENCHMARK_RESULT]
            const conclusion = results.includes('failure') ? 'failure'
              : results.includes('cancelled') ? 'cancelled'
              : process.env.BENCHMARK_RESULT
            await report({
              github, context, name: 'Type checker benchmark', checkId: process.env.CHECK_ID,
              conclusion, summary: `Type checker benchmark: ${conclusion}. See the workflow run for results.`,
            })
