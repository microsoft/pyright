# This workflow runs mypy_primer, a tool that runs pyright on a variety
# of open-source Python projects that are known to type check with pyright.
# It builds pyright from the latest PR commit and the merge base of the PR
# and compares the output of both. It uploads the diffs as an artifact and
# creates a PR comment with the results (with the help of the
# mypy_primer_comment action).

# This workflow definition borrows liberally from the mypy repo. The original
# workflow was designed to work in a sharded manner where n copies of
# mypy_primer are started in parallel. Each instance runs 1/n of the projects.
# For now, we run only one instance because pyright is fast, and the number
# of projects that use pyright for type checking is small. To change this in
# the future, change the 'shard_index' matrix to [0, 1, ..., n-1] and set
# 'num-shards' to n.

name: Run mypy_primer on PR
run-name: 'Run mypy_primer after Validation #${{ github.event.workflow_run.id }}'

env:
  NODE_VERSION: '24.15.0' # Shipped with VS Code.

on:
  workflow_run:
    workflows:
      - Validation
    types:
      - completed

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve validated PR
    if: >-
      ${{ github.repository == 'microsoft/pyright' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pr-follow-up-mypy_primer-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      checks: write
    outputs:
      pr-number: ${{ steps.resolve.outputs.pr-number }}
      merge-sha: ${{ steps.resolve.outputs.merge-sha }}
      check-id: ${{ steps.resolve.outputs.check-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Resolve primer revisions
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const resolve = require('./build/resolveValidatedPullRequest.js')
            const validated = await resolve({ github, context, core })
            if (!validated) return
            const { pullRequest } = validated
            const report = require('./build/reportPullRequestCheck.js')
            const checkId = await report({
              github, context, name: 'mypy_primer', headSha: pullRequest.head.sha,
              status: 'in_progress', summary: 'Running mypy_primer after successful Validation.',
            })
            core.setOutput('check-id', checkId)
            if (!pullRequest.merge_commit_sha) {
              core.setFailed('The pull request does not have a merge commit to test')
              return
            }
            const commit = await github.rest.repos.getCommit({
              ...context.repo,
              ref: pullRequest.merge_commit_sha,
            })
            if (commit.data.parents[1]?.sha !== context.payload.workflow_run.head_sha) {
              core.setFailed('The merge commit does not use the validated pull request head')
              return
            }
            core.setOutput('pr-number', pullRequest.number)
            core.setOutput('merge-sha', pullRequest.merge_commit_sha)

  mypy_primer:
    name: Run mypy_primer on PR
    needs: resolve
    if: ${{ needs.resolve.outputs.pr-number != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        shard-index: [0, 1, 2, 3, 4, 5, 6, 7]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.merge-sha }}
          persist-credentials: false
          path: pyright_to_test
          fetch-depth: 2
          fetch-tags: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: pyright_to_test/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install git+https://github.com/hauntsaninja/mypy_primer.git
      - name: Run mypy_primer
        shell: bash
        env:
          PRIMER_SHA: ${{ needs.resolve.outputs.merge-sha }}
          # mypy_primer installs both the PR and base commits. The base commit can contain
          # historical peer dependency conflicts that should not block primer comparisons.
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          cd pyright_to_test
          echo "new commit"
          git rev-list --format=%s --max-count=1 "$PRIMER_SHA"
          git branch new_commit "$PRIMER_SHA"

          MERGE_BASE=$(git rev-parse "$PRIMER_SHA^1")
          git checkout -b base_commit $MERGE_BASE
          echo "base commit"
          git rev-list --format=%s --max-count=1 base_commit
          # Keep the old checker source at the merge base, but use this PR's
          # dependency and bundler metadata so the old checkout can install and build.
          mapfile -t BASE_BUILD_FILES < <(
            git ls-tree -r --name-only "$PRIMER_SHA" |
              grep -E '^(package(-lock)?\.json|pnpm-(lock|workspace)\.yaml|packages/[^/]+/package(-lock)?\.json|packages/[^/]+/rspack\.config\.js)$'
          )
          echo "Using build metadata for mypy_primer base:"
          printf '%s\n' "${BASE_BUILD_FILES[@]}"
          git checkout "$PRIMER_SHA" -- "${BASE_BUILD_FILES[@]}"
          printf 'legacy-peer-deps=true\n' > .npmrc
          git add .npmrc "${BASE_BUILD_FILES[@]}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Configure build dependencies for mypy_primer base"
          echo "Prepared mypy_primer base_commit with generated package and rspack build metadata."

          echo ''
          cd ..
          npm config set legacy-peer-deps true --location=user
          npm config get legacy-peer-deps
          # fail action if exit code isn't zero or one
          (
            mypy_primer \
            --repo pyright_to_test \
            --type-checker pyright \
            --new new_commit --old base_commit \
            --num-shards 8 --shard-index ${{ matrix.shard-index }} \
            --debug \
            --output concise \
            | tee diff_${{ matrix.shard-index }}.txt
          ) || [ $? -eq 1 ]
      - name: Upload mypy_primer diff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mypy_primer_diffs_${{ matrix.shard-index }}
          path: diff_${{ matrix.shard-index }}.txt
      - if: ${{ matrix.shard-index == 0 }}
        name: Save PR number
        run: |
          echo ${{ needs.resolve.outputs.pr-number }} | tee pr_number.txt
      - if: ${{ matrix.shard-index == 0 }}
        name: Upload PR number
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mypy_primer_diffs_pr_number
          path: pr_number.txt

  report:
    name: Report mypy_primer check
    needs: [resolve, mypy_primer]
    if: ${{ always() && needs.resolve.outputs.check-id != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECK_ID: ${{ needs.resolve.outputs.check-id }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          PRIMER_RESULT: ${{ needs.mypy_primer.result }}
        with:
          script: |
            const report = require('./build/reportPullRequestCheck.js')
            const results = [process.env.RESOLVE_RESULT, process.env.PRIMER_RESULT]
            const conclusion = results.includes('failure') ? 'failure'
              : results.includes('cancelled') ? 'cancelled'
              : process.env.PRIMER_RESULT
            await report({
              github, context, name: 'mypy_primer', checkId: process.env.CHECK_ID,
              conclusion, summary: `mypy_primer: ${conclusion}. See the workflow run for shard results.`,
            })
