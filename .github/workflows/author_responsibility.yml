name: 'Author responsibility'

# Checks that the PR description's author responsibility box from the PR template is checked.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    if: github.repository == 'microsoft/pyright'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    concurrency:
      group: author-responsibility-${{ github.event.pull_request.number || 'all' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const check = require('./build/checkAuthorResponsibility.js');
            const { owner, repo } = context.repo;
            const policy = `[AI contribution policy](${context.serverUrl}/${owner}/${repo}/blob/main/AI_POLICY.md)`;

            async function report(pullNumber) {
                const { pullRequest: pr, result } = await check.evaluate({ github, context, pullNumber });
                await github.rest.repos.createCommitStatus({
                    owner,
                    repo,
                    sha: pr.head.sha,
                    context: check.NAME,
                    state: result.state,
                    description: result.description,
                    target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                });
                if (result.exempt) {
                    return;
                }

                const comments = await github.paginate(github.rest.issues.listComments, {
                    owner,
                    repo,
                    issue_number: pr.number,
                    per_page: 100,
                });
                const existing = comments.find(
                    (c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(check.MARKER)
                );
                if (result.state === 'success') {
                    if (existing) {
                        await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
                    }
                    return;
                }
                if (!existing && pr.draft) {
                    return;
                }
                const body = `${check.MARKER}\n\n:warning: **Action needed:** ${result.problem} See the ${policy}.`;
                if (existing?.body === body) {
                    return;
                }
                if (existing) {
                    await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                } else {
                    await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
                }
            }

            if (context.eventName === 'pull_request_target') {
                await report(context.payload.pull_request.number);
            } else {
                const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
                for (const pr of prs) {
                    await report(pr.number);
                }
            }
