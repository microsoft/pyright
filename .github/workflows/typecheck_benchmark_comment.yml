name: Comment with type checker benchmark

on:
  workflow_run:
    workflows:
      - Type checker benchmark
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Comment benchmark results
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download benchmark results
        id: download
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const workflowRun = context.payload.workflow_run
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: workflowRun.id,
            })
            let issueNumber
            let expectedHeadSha
            let expectedBaseSha
            let expectedMergeSha
            let report
            if (workflowRun.event === 'pull_request') {
              const pullRequests = workflowRun.pull_requests
              if (pullRequests.length !== 1) {
                core.setFailed(`Expected one pull request, found ${pullRequests.length}`)
                return
              }
              issueNumber = pullRequests[0].number
              expectedHeadSha = workflowRun.head_sha
              expectedBaseSha = pullRequests[0].base.sha
              report = artifacts.data.artifacts.find(
                (artifact) => artifact.name === 'typecheck-benchmark-linux-x64'
              )
            } else {
              const dispatchedReports = artifacts.data.artifacts.flatMap((artifact) => {
                const match = artifact.name.match(
                  /^typecheck-benchmark-linux-x64-pr-(\d+)-head-([0-9a-f]{40})-base-([0-9a-f]{40})-merge-([0-9a-f]{40})$/
                )
                return match
                  ? [
                      {
                        artifact,
                        issueNumber: Number(match[1]),
                        headSha: match[2],
                        baseSha: match[3],
                        mergeSha: match[4],
                      },
                    ]
                  : []
              })
              if (dispatchedReports.length !== 1) {
                core.setFailed(`Expected one dispatched benchmark report, found ${dispatchedReports.length}`)
                return
              }
              report = dispatchedReports[0].artifact
              issueNumber = dispatchedReports[0].issueNumber
              expectedHeadSha = dispatchedReports[0].headSha
              expectedBaseSha = dispatchedReports[0].baseSha
              expectedMergeSha = dispatchedReports[0].mergeSha
            }
            if (!report) {
              core.setFailed('The benchmark report artifact was not found')
              return
            }
            const pullRequest = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issueNumber,
            })
            if (pullRequest.data.head.sha !== expectedHeadSha) {
              core.setFailed('The workflow run head does not match the pull request head')
              return
            }
            if (pullRequest.data.base.sha !== expectedBaseSha) {
              core.setFailed('The workflow run base does not match the pull request base')
              return
            }
            if (expectedMergeSha && pullRequest.data.merge_commit_sha !== expectedMergeSha) {
              core.setFailed('The workflow run merge commit does not match the pull request merge commit')
              return
            }
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: report.id,
              archive_format: 'zip',
            })
            fs.writeFileSync('benchmark-report.zip', Buffer.from(download.data))
            core.setOutput('pr-number', issueNumber)

      - name: Extract candidate results
        if: ${{ steps.download.outputs.pr-number != '' }}
        run: |
          python - <<'PY'
          import json
          import zipfile
          from pathlib import PurePosixPath

          def reject_constant(value):
              raise ValueError(f'Non-finite JSON number: {value}')

          with zipfile.ZipFile('benchmark-report.zip') as archive:
              matches = [
                  info
                  for info in archive.infolist()
                  if PurePosixPath(info.filename).name == 'latest-linux-x64.json'
                  and '..' not in PurePosixPath(info.filename).parts
              ]
              if len(matches) != 1:
                  raise RuntimeError(f'Expected one candidate result, found {len(matches)}')
              if matches[0].file_size > 5 * 1024 * 1024:
                  raise RuntimeError('Candidate result exceeds 5 MB')
              contents = archive.read(matches[0])
          data = json.loads(contents, parse_constant=reject_constant)
          if not isinstance(data, dict):
              raise RuntimeError('Candidate result must be a JSON object')
          with open('candidate.json', 'wb') as output:
              output.write(contents)
          PY

      - name: Render benchmark report
        if: ${{ steps.download.outputs.pr-number != '' }}
        run: |
          set +e
          python build/benchmark/compare_benchmarks.py \
            build/benchmark/baselines/latest-linux-x64.json \
            candidate.json \
            --fail-on-preparation-error \
            --markdown-output report.md
          if [[ ! -s report.md ]]; then
            printf '%s\n' \
              '## Type checker benchmark' \
              '' \
              '🔴 **The benchmark results could not be compared. See the workflow run for details.**' \
              > report.md
          fi

      - name: Post benchmark comment
        if: ${{ steps.download.outputs.pr-number != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- typecheck-benchmark-report -->'
            const report = fs.readFileSync('report.md', 'utf8')
            const issueNumber = Number('${{ steps.download.outputs.pr-number }}')
            const body = `${marker}\n${report}`
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            })
            const previous = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              })
            }
