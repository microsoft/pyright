name: Comment with type checker benchmark

on:
  workflow_run:
    workflows:
      - Type checker benchmark
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Comment benchmark results
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    steps:
      - name: Download benchmark report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            })
            const report = artifacts.data.artifacts.find(
              (artifact) => artifact.name === 'typecheck-benchmark-linux-x64'
            )
            if (!report) {
              core.setFailed('The benchmark report artifact was not found')
              return
            }
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: report.id,
              archive_format: 'zip',
            })
            fs.writeFileSync('benchmark-report.zip', Buffer.from(download.data))

      - name: Extract benchmark report
        run: unzip -q benchmark-report.zip -d benchmark-report

      - name: Post benchmark comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- typecheck-benchmark-report -->'
            const report = fs.readFileSync('benchmark-report/report.md', 'utf8')
            const issueNumber = Number(
              fs.readFileSync('benchmark-report/pr_number.txt', 'utf8').trim()
            )
            const body = `${marker}\n${report}`
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            })
            const previous = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              })
            }
