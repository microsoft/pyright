name: Type checker benchmark
run-name: 'Type checker benchmark for PR #${{ inputs.pr_number }}'

env:
  BENCHMARK_RUNNER_CLASS: 'github-ubuntu-latest'
  NODE_VERSION: '24.15.0'
  PNPM_VERSION: '10.12.2'
  PYTHON_VERSION: '3.14.6'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Resolve pull request revisions
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      head-sha: ${{ steps.pull-request.outputs.head-sha }}
      head-ref: ${{ steps.pull-request.outputs.head-ref }}
      head-repository: ${{ steps.pull-request.outputs.head-repository }}
      base-sha: ${{ steps.pull-request.outputs.base-sha }}
      merge-sha: ${{ steps.pull-request.outputs.merge-sha }}
    steps:
      - name: Read pull request metadata
        id: pull-request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const issueNumber = Number(process.env.PR_NUMBER)
            if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed('The pull request number is invalid')
              return
            }
            const pullRequest = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issueNumber,
            })
            if (pullRequest.data.state !== 'open' || !pullRequest.data.merge_commit_sha) {
              core.setFailed('The pull request is not open or does not have a merge commit')
              return
            }
            core.setOutput('head-sha', pullRequest.data.head.sha)
            core.setOutput('head-ref', pullRequest.data.head.ref)
            core.setOutput('head-repository', pullRequest.data.head.repo.full_name)
            core.setOutput('base-sha', pullRequest.data.base.sha)
            core.setOutput('merge-sha', pullRequest.data.merge_commit_sha)

  base-benchmark:
    name: Benchmark base commit
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      cached: ${{ steps.cached-result.outputs.valid }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.base-sha }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Determine base cache key
        id: cache-key
        shell: bash
        env:
          BASE_SHA: ${{ needs.metadata.outputs.base-sha }}
        run: |
          profile="${ImageOS}-${ImageVersion}-$(uname -m)-cpu$(nproc)-python${PYTHON_VERSION}-node${NODE_VERSION}-pnpm${PNPM_VERSION}-r1-w0-m8192-heap6656"
          profile="$(printf '%s' "$profile" | tr -c 'A-Za-z0-9_.-' '-')"
          echo "value=typecheck-benchmark-base-v2-${BASE_SHA}-${profile}" >> "$GITHUB_OUTPUT"

      - name: Restore cached base result
        id: base-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/benchmark/base-results/latest-linux-x64.json
          key: ${{ steps.cache-key.outputs.value }}

      - name: Validate cached base result
        id: cached-result
        shell: bash
        env:
          BASE_SHA: ${{ needs.metadata.outputs.base-sha }}
        run: |
          result=build/benchmark/base-results/latest-linux-x64.json
          if [[ "${{ steps.base-cache.outputs.cache-hit }}" == "true" ]] && \
            python -c "import hashlib,json,sys; data=json.load(open(sys.argv[1], encoding='utf-8')); digest=hashlib.sha256(b''.join(open(path, 'rb').read() for path in sys.argv[3:])).hexdigest(); sys.exit(data.get('source_revision') != sys.argv[2] or not data.get('source_commit_subject') or not data.get('source_commit_timestamp') or data.get('benchmark_profile_hash') != digest)" \
              "$result" "$BASE_SHA" build/benchmark/typecheck_benchmark.py \
              build/benchmark/install_envs.json && \
            python build/benchmark/compare_benchmarks.py "$result" "$result" \
              --fail-on-preparation-error; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            rm -f "$result"
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ steps.cached-result.outputs.valid != 'true' }}
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - if: ${{ steps.cached-result.outputs.valid != 'true' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify build prerequisites
        if: ${{ steps.cached-result.outputs.valid != 'true' }}
        run: |
          gcc --version
          g++ --version
          make --version

      - name: Install JavaScript dependencies
        if: ${{ steps.cached-result.outputs.valid != 'true' }}
        timeout-minutes: 10
        env:
          SKIP_LERNA_BOOTSTRAP: 'yes'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Pyright CLI
        if: ${{ steps.cached-result.outputs.valid != 'true' }}
        working-directory: packages/pyright
        run: pnpm run build

      - name: Benchmark base commit
        if: ${{ steps.cached-result.outputs.valid != 'true' }}
        env:
          NODE_OPTIONS: '--max-old-space-size=6656'
          PYTHONNOUSERSITE: '1'
        run: |
          python build/benchmark/typecheck_benchmark.py \
            -c pyright -r 1 -w 0 -t 1800 --memory-limit-mb 8192 \
            --skip-pyright-build --os-name linux-x64 \
            --output build/benchmark/base-results

      - name: Record base revision
        if: ${{ steps.cached-result.outputs.valid != 'true' }}
        env:
          BASE_SHA: ${{ needs.metadata.outputs.base-sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
            import subprocess
          from pathlib import Path

          path = Path('build/benchmark/base-results/latest-linux-x64.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['source_revision'] = os.environ['BASE_SHA']
            data['source_commit_subject'] = subprocess.check_output(
              ['git', 'show', '-s', '--format=%s', os.environ['BASE_SHA']], text=True
            ).strip()
            data['source_commit_timestamp'] = subprocess.check_output(
              ['git', 'show', '-s', '--format=%cI', os.environ['BASE_SHA']], text=True
            ).strip()
          profile = hashlib.sha256()
          for profile_path in (
              Path('build/benchmark/typecheck_benchmark.py'),
              Path('build/benchmark/install_envs.json'),
          ):
              profile.update(profile_path.read_bytes())
          data['benchmark_profile_hash'] = profile.hexdigest()
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate base result
        env:
          BASE_SHA: ${{ needs.metadata.outputs.base-sha }}
        run: |
          python build/benchmark/compare_benchmarks.py \
            build/benchmark/base-results/latest-linux-x64.json \
            build/benchmark/base-results/latest-linux-x64.json \
            --fail-on-preparation-error
          python -c "import json,sys; data=json.load(open(sys.argv[1], encoding='utf-8')); sys.exit(data.get('source_revision') != sys.argv[2])" \
            build/benchmark/base-results/latest-linux-x64.json "$BASE_SHA"

      - name: Save base result cache
        if: ${{ steps.cached-result.outputs.valid != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/benchmark/base-results/latest-linux-x64.json
          key: ${{ steps.cache-key.outputs.value }}

      - name: Upload base result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typecheck-benchmark-base-${{ needs.metadata.outputs.base-sha }}
          path: build/benchmark/base-results/latest-linux-x64.json

  candidate-benchmark:
    name: Benchmark pull request merge
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.merge-sha }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify build prerequisites
        run: |
          gcc --version
          g++ --version
          make --version

      - name: Install JavaScript dependencies
        timeout-minutes: 10
        env:
          SKIP_LERNA_BOOTSTRAP: 'yes'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Pyright CLI
        working-directory: packages/pyright
        run: pnpm run build

      - name: Benchmark pull request merge
        env:
          NODE_OPTIONS: '--max-old-space-size=6656'
          PYTHONNOUSERSITE: '1'
        run: |
          python build/benchmark/typecheck_benchmark.py \
            -c pyright -r 1 -w 0 -t 1800 --memory-limit-mb 8192 \
            --skip-pyright-build --os-name linux-x64 \
            --output build/benchmark/candidate-results

      - name: Record candidate revision and profile
        env:
          MERGE_SHA: ${{ needs.metadata.outputs.merge-sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
            import subprocess
          from pathlib import Path

          path = Path('build/benchmark/candidate-results/latest-linux-x64.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['source_revision'] = os.environ['MERGE_SHA']
            data['source_commit_subject'] = subprocess.check_output(
              ['git', 'show', '-s', '--format=%s', os.environ['MERGE_SHA']], text=True
            ).strip()
            data['source_commit_timestamp'] = subprocess.check_output(
              ['git', 'show', '-s', '--format=%cI', os.environ['MERGE_SHA']], text=True
            ).strip()
          profile = hashlib.sha256()
          for profile_path in (
              Path('build/benchmark/typecheck_benchmark.py'),
              Path('build/benchmark/install_envs.json'),
          ):
              profile.update(profile_path.read_bytes())
          data['benchmark_profile_hash'] = profile.hexdigest()
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload candidate result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typecheck-benchmark-candidate-${{ needs.metadata.outputs.merge-sha }}
          path: build/benchmark/candidate-results/latest-linux-x64.json

  comparison:
    name: Compare Pyright performance
    needs: [metadata, base-benchmark, candidate-benchmark]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download base result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: typecheck-benchmark-base-${{ needs.metadata.outputs.base-sha }}
          path: benchmark-report/base

      - name: Download candidate result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: typecheck-benchmark-candidate-${{ needs.metadata.outputs.merge-sha }}
          path: benchmark-report/candidate

      - name: Compare with base commit
        id: comparison
        continue-on-error: true
        env:
          BASE_SHA: ${{ needs.metadata.outputs.base-sha }}
          MERGE_SHA: ${{ needs.metadata.outputs.merge-sha }}
        run: |
          set +e
          python build/benchmark/compare_benchmarks.py \
            benchmark-report/base/latest-linux-x64.json \
            benchmark-report/candidate/latest-linux-x64.json \
            --fail-on-preparation-error \
            --allow-incompatible \
            --baseline-revision "$BASE_SHA" --candidate-revision "$MERGE_SHA" \
            --markdown-output benchmark-report/report.md
          comparison_status=$?
          cat benchmark-report/report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$comparison_status"

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typecheck-benchmark-linux-x64-pr-${{ inputs.pr_number }}-head-${{ needs.metadata.outputs.head-sha }}-base-${{ needs.metadata.outputs.base-sha }}-merge-${{ needs.metadata.outputs.merge-sha }}
          path: benchmark-report/

      - name: Fail on benchmark regressions
        if: ${{ steps.comparison.outcome == 'failure' }}
        run: exit 1

  comment:
    name: Comment benchmark results
    needs: [metadata, comparison]
    if: ${{ always() && needs.metadata.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download benchmark results
        id: download
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.metadata.outputs.head-sha }}
          EXPECTED_BASE_SHA: ${{ needs.metadata.outputs.base-sha }}
          EXPECTED_MERGE_SHA: ${{ needs.metadata.outputs.merge-sha }}
        with:
          script: |
            const fs = require('fs')
            const issueNumber = Number(process.env.PR_NUMBER)
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA
            const expectedBaseSha = process.env.EXPECTED_BASE_SHA
            const expectedMergeSha = process.env.EXPECTED_MERGE_SHA
            const shaPattern = /^[0-9a-f]{40}$/
            if (
              !Number.isSafeInteger(issueNumber) ||
              issueNumber <= 0 ||
              !shaPattern.test(expectedHeadSha) ||
              !shaPattern.test(expectedBaseSha) ||
              !shaPattern.test(expectedMergeSha)
            ) {
              core.setFailed('The benchmark dispatch inputs are invalid')
              return
            }
            const artifactName =
              `typecheck-benchmark-linux-x64-pr-${issueNumber}` +
              `-head-${expectedHeadSha}-base-${expectedBaseSha}-merge-${expectedMergeSha}`
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            })
            const reports = artifacts.filter((artifact) => artifact.name === artifactName)
            if (reports.length !== 1) {
              core.setFailed(`Expected one benchmark report artifact, found ${reports.length}`)
              return
            }
            const pullRequest = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issueNumber,
            })
            if (pullRequest.data.head.sha !== expectedHeadSha) {
              core.setFailed('The workflow run head does not match the pull request head')
              return
            }
            if (pullRequest.data.base.sha !== expectedBaseSha) {
              core.setFailed('The workflow run base does not match the pull request base')
              return
            }
            if (pullRequest.data.merge_commit_sha !== expectedMergeSha) {
              core.setFailed('The workflow run merge commit does not match the pull request merge commit')
              return
            }
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: reports[0].id,
              archive_format: 'zip',
            })
            fs.writeFileSync('benchmark-report.zip', Buffer.from(download.data))
            core.setOutput('pr-number', issueNumber)

      - name: Extract benchmark results
        if: ${{ steps.download.outputs.pr-number != '' }}
        run: |
          python - <<'PY'
          import json
          import zipfile
          from pathlib import PurePosixPath

          def reject_constant(value):
              raise ValueError(f'Non-finite JSON number: {value}')

          with zipfile.ZipFile('benchmark-report.zip') as archive:
              entries = {
                PurePosixPath(info.filename): info
                for info in archive.infolist()
                if '..' not in PurePosixPath(info.filename).parts
              }
              for archive_path, output_path in (
                (PurePosixPath('base/latest-linux-x64.json'), 'base.json'),
                (PurePosixPath('candidate/latest-linux-x64.json'), 'candidate.json'),
              ):
                info = entries.get(archive_path)
                if info is None:
                  raise RuntimeError(f'Missing benchmark result: {archive_path}')
                if info.file_size > 5 * 1024 * 1024:
                  raise RuntimeError(f'Benchmark result exceeds 5 MB: {archive_path}')
                contents = archive.read(info)
                data = json.loads(contents, parse_constant=reject_constant)
                if not isinstance(data, dict):
                  raise RuntimeError(f'Benchmark result must be an object: {archive_path}')
                with open(output_path, 'wb') as output:
                  output.write(contents)
          PY

      - name: Render benchmark report
        if: ${{ steps.download.outputs.pr-number != '' }}
        run: |
          set +e
          python build/benchmark/compare_benchmarks.py \
            base.json \
            candidate.json \
            --fail-on-preparation-error \
            --allow-incompatible \
            --baseline-revision "${{ needs.metadata.outputs.base-sha }}" \
            --candidate-revision "${{ needs.metadata.outputs.merge-sha }}" \
            --markdown-output report.md
          if [[ ! -s report.md ]]; then
            printf '%s\n' \
              '## Type checker benchmark' \
              '' \
              '🔴 **The benchmark results could not be compared. See the workflow run for details.**' \
              > report.md
          fi

      - name: Post benchmark comment
        if: ${{ steps.download.outputs.pr-number != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.download.outputs.pr-number }}
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- typecheck-benchmark-report -->'
            const report = fs.readFileSync('report.md', 'utf8')
            const issueNumber = Number(process.env.PR_NUMBER)
            const body = `${marker}\n${report}`
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            })
            const previous = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker)
            )
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              })
            }

  persist-base-result:
    name: Update pull request baseline
    needs: [metadata, base-benchmark, comment]
    if: >-
      ${{ !cancelled() && needs.base-benchmark.result == 'success' &&
      needs.base-benchmark.outputs.cached != 'true' &&
      needs.metadata.outputs.head-repository == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download base result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: typecheck-benchmark-base-${{ needs.metadata.outputs.base-sha }}
          path: benchmark-result

      - name: Commit baseline to pull request branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_HEAD_SHA: ${{ needs.metadata.outputs.head-sha }}
          HEAD_REF: ${{ needs.metadata.outputs.head-ref }}
          BASE_SHA: ${{ needs.metadata.outputs.base-sha }}
        with:
          script: |
            const fs = require('fs')
            const path = 'benchmark-result/latest-linux-x64.json'
            const contents = fs.readFileSync(path, 'utf8')
            const result = JSON.parse(contents)
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA
            const headRef = process.env.HEAD_REF
            const baseSha = process.env.BASE_SHA
            if (
              result.source_revision !== baseSha ||
              typeof result.source_commit_subject !== 'string' ||
              result.source_commit_subject.length === 0 ||
              Number.isNaN(Date.parse(result.source_commit_timestamp)) ||
              Number.isNaN(Date.parse(result.timestamp)) ||
              !/^\d{4}-\d{2}-\d{2}$/.test(result.date)
            ) {
              core.setFailed('The base benchmark result metadata is invalid')
              return
            }

            const currentRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${headRef}`,
            })
            if (currentRef.data.object.sha !== expectedHeadSha) {
              core.notice('The pull request head changed; skipping the baseline update')
              return
            }

            const parent = await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: expectedHeadSha,
            })
            const blob = await github.rest.git.createBlob({
              owner: context.repo.owner,
              repo: context.repo.repo,
              content: Buffer.from(contents).toString('base64'),
              encoding: 'base64',
            })
            const tree = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base_tree: parent.data.tree.sha,
              tree: [
                {
                  path: 'build/benchmark/baselines/latest-linux-x64.json',
                  mode: '100644',
                  type: 'blob',
                  sha: blob.data.sha,
                },
                {
                  path: `build/benchmark/baselines/benchmark_${result.date}_linux-x64.json`,
                  mode: '100644',
                  type: 'blob',
                  sha: blob.data.sha,
                },
              ],
            })
            const commit = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: `Update benchmark baseline for ${baseSha.slice(0, 12)}`,
              tree: tree.data.sha,
              parents: [expectedHeadSha],
            })
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${headRef}`,
              sha: commit.data.sha,
              force: false,
            })
