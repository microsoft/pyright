name: 'Validation'

env:
  NODE_VERSION: '24.15.0' # Shipped with VS Code.
  PYTHON_VERSION: 3.11

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  typecheck:
    if: github.repository == 'microsoft/pyright'
    runs-on: ubuntu-latest
    name: Typecheck

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - uses: ./.github/actions/choose-npm-install

      - run: pnpm exec lerna exec --stream --no-bail -- "tsc --noEmit"

  style:
    if: github.repository == 'microsoft/pyright'
    runs-on: ubuntu-latest
    name: Style

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - uses: ./.github/actions/choose-npm-install

      - name: Check diff after pnpm install
        run: git diff --exit-code --name-only

      - run: pnpm run check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: typecheck

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - uses: ./.github/actions/choose-npm-install

      - name: pnpm test (pyright-internal)
        if: matrix.os != 'macos-latest'
        run: pnpm test
        working-directory: packages/pyright-internal

      - name: pnpm test (pyright-internal, macOS)
        id: mac_tests
        if: matrix.os == 'macos-latest'
        shell: bash
        # Parallel workers cause swapping on the 7 GiB hosted macOS runners.
        run: |
          set -o pipefail
          /usr/bin/time -lp pnpm test --maxWorkers=1 --json --outputFile=mac-test-results.json 2>&1 | tee mac-test.log
        working-directory: packages/pyright-internal

      - name: Report macOS test timings
        if: always() && matrix.os == 'macos-latest' && steps.mac_tests.outcome != 'skipped'
        shell: bash
        working-directory: packages/pyright-internal
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const notice = (title, text) => console.log(`::notice title=${title}::${text.slice(0, 12000).replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A')}`);
          const log = fs.readFileSync('mac-test.log', 'utf8');
          notice('Mac test log tail', log.split('\n').slice(-40).join('\n').slice(-6000));
          if (!fs.existsSync('mac-test-results.json')) {
              throw new Error('Mac tests did not produce JSON results; see the Mac test log tail.');
          }
          const results = JSON.parse(fs.readFileSync('mac-test-results.json', 'utf8'));
          notice('Mac test summary', JSON.stringify({
              success: results.success,
              passedTests: results.numPassedTests,
              failedTests: results.numFailedTests,
              passedSuites: results.numPassedTestSuites,
              failedSuites: results.numFailedTestSuites,
          }));
          const suites = [...results.testResults].sort((a, b) => (b.endTime - b.startTime) - (a.endTime - a.startTime));
          notice('Mac slow suites', suites.slice(0, 8).map((suite) =>
              `${path.basename(suite.name)}: ${(suite.endTime - suite.startTime) / 1000}s (${suite.status})`
          ).join('\n'));
          const failures = suites.filter((suite) => suite.status === 'failed').slice(0, 5);
          if (failures.length) {
              notice('Mac test failures', failures.map((suite) =>
                  `${path.basename(suite.name)}: ${suite.message}\n${suite.assertionResults.filter((test) =>
                      test.status === 'failed'
                  ).map((test) => `${test.fullName}: ${test.failureMessages.join('\n')}`).join('\n')}`.slice(0, 6000)
              ).join('\n'));
          }
          NODE

      - name: Upload macOS test logs
        if: always() && matrix.os == 'macos-latest' && steps.mac_tests.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-test-logs-${{ github.run_attempt }}
          path: |
            packages/pyright-internal/mac-test.log
            packages/pyright-internal/mac-test-results.json
          if-no-files-found: error
          retention-days: 7

      # Install python so we can create a VENV for tests
      - name: Use Python ${{env.PYTHON_VERSION}}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: install_python
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Create Venv
        run: |
          ${{ steps.install_python.outputs.python-path }} -m venv .venv

      - name: Activate and install pytest (linux)
        if: runner.os != 'Windows'
        run: |
          source .venv/bin/activate
          python -m pip install pytest
          python -c "import sys;print('python_venv_path=' + sys.executable)" >> $GITHUB_ENV

      - name: Activate and install pytest (windows)
        if: runner.os == 'Windows'
        run: |
          .venv\scripts\activate
          python -m pip install pytest
          python -c "import sys;print('python_venv_path=' + sys.executable)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Echo python_venv_path
        run: |
          echo python_venv_path=${{env.python_venv_path}}

      - name: Run import tests with venv
        env:
          CI_IMPORT_TEST_VENVPATH: '../../'
          CI_IMPORT_TEST_VENV: '.venv'
        run: pnpm run test:imports
        working-directory: packages/pyright-internal

      - name: Run import tests with pythonpath
        env:
          CI_IMPORT_TEST_PYTHONPATH: ${{env.python_venv_path}}
        run: pnpm run test:imports
        working-directory: packages/pyright-internal

  build:
    runs-on: ubuntu-latest
    name: Build
    needs: typecheck
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - uses: ./.github/actions/choose-npm-install

      - run: npm pack --dry-run
        working-directory: packages/pyright

      - run: npm pack --dry-run
        working-directory: packages/pyright-typeserver

      - run: pnpm run package
        working-directory: packages/vscode-pyright

  required:
    runs-on: ubuntu-latest
    name: Required
    needs:
      - typecheck
      - style
      - test
      - build

    steps:
      - run: echo All required jobs succeeded.
