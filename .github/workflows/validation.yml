name: 'Validation'

env:
  NODE_VERSION: '24.15.0' # Shipped with VS Code.
  PYTHON_VERSION: 3.11

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  typecheck:
    if: github.repository == 'microsoft/pyright'
    runs-on: ubuntu-latest
    name: Typecheck

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - uses: ./.github/actions/choose-npm-install

      - run: pnpm exec lerna exec --stream --no-bail -- "tsc --noEmit"

  style:
    if: github.repository == 'microsoft/pyright'
    runs-on: ubuntu-latest
    name: Style

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - uses: ./.github/actions/choose-npm-install

      - name: Check diff after pnpm install
        run: git diff --exit-code --name-only

      - run: pnpm run check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: typecheck
    env:
      # Parallel workers cause swapping on the 7 GiB hosted macOS runners.
      JEST_WORKER_ARGS: ${{ matrix.os == 'macos-latest' && '--maxWorkers=1' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - uses: ./.github/actions/choose-npm-install

      - name: Report test runner resources
        shell: bash
        working-directory: packages/pyright-internal
        run: |
          node <<'NODE'
          const os = require('os');
          const { execFileSync } = require('child_process');
          const notice = (title, text) => console.log(`::notice title=${title}::${text.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A')}`);
          const workerArgs = process.env.JEST_WORKER_ARGS ? [process.env.JEST_WORKER_ARGS] : [];
          const config = JSON.parse(execFileSync(process.execPath, ['./node_modules/jest/bin/jest', '--showConfig', ...workerArgs], { encoding: 'utf8' }));
          notice('Test runner resources', JSON.stringify({
              node: process.version,
              platform: process.platform,
              arch: process.arch,
              cpuModel: os.cpus()[0].model,
              logicalCpus: os.cpus().length,
              availableParallelism: os.availableParallelism(),
              totalMemoryGiB: os.totalmem() / 2 ** 30,
              freeMemoryGiB: os.freemem() / 2 ** 30,
              jestWorkers: config.globalConfig.maxWorkers,
          }));
          if (process.platform === 'darwin') {
              notice('Mac memory before tests', execFileSync('vm_stat', { encoding: 'utf8' }));
              notice('Mac swap before tests', execFileSync('sysctl', ['vm.swapusage'], { encoding: 'utf8' }));
          }
          NODE

      - name: pnpm test (pyright-internal)
        id: pyright_tests
        run: pnpm test --json --outputFile=test-results.json ${{ env.JEST_WORKER_ARGS }}
        working-directory: packages/pyright-internal

      - name: Report test diagnostics
        if: always() && steps.pyright_tests.outcome != 'skipped'
        shell: bash
        working-directory: packages/pyright-internal
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const notice = (title, text) => console.log(`::notice title=${title}::${text.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A')}`);
          if (process.platform === 'darwin') {
              notice('Mac memory after tests', execFileSync('vm_stat', { encoding: 'utf8' }));
              notice('Mac swap after tests', execFileSync('sysctl', ['vm.swapusage'], { encoding: 'utf8' }));
          }
          if (!fs.existsSync('test-results.json')) {
              notice('Jest results missing', 'The test step did not write JSON results; check for a process-level failure.');
              throw new Error('Jest results missing');
          }
          const results = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
          notice('Jest summary', JSON.stringify({
              success: results.success,
              passedTests: results.numPassedTests,
              failedTests: results.numFailedTests,
              passedSuites: results.numPassedTestSuites,
              failedSuites: results.numFailedTestSuites,
          }));
          const suites = [...results.testResults].sort((a, b) => (b.endTime - b.startTime) - (a.endTime - a.startTime));
          notice('Jest slow suites', suites.slice(0, 8).map((suite) =>
              `${path.basename(suite.name)}: ${(suite.endTime - suite.startTime) / 1000}s (${suite.status})`
          ).join('\n'));
          const failingSuites = suites.filter((suite) => suite.status === 'failed').slice(0, 5);
          if (failingSuites.length) {
              notice('Jest failing suites', failingSuites.map((suite) =>
                  `${path.basename(suite.name)}: ${suite.message.slice(0, 6000)}`
              ).join('\n'));
          }
          const failures = results.testResults.flatMap((suite) => suite.assertionResults.filter((test) => test.status === 'failed'));
          if (failures.length) {
              notice('Jest failing tests', failures.slice(0, 5).map((test) =>
                  `${test.fullName}: ${test.failureMessages.join('\n').slice(0, 6000)}`
              ).join('\n'));
          }
          NODE

      # Install python so we can create a VENV for tests
      - name: Use Python ${{env.PYTHON_VERSION}}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: install_python
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Create Venv
        run: |
          ${{ steps.install_python.outputs.python-path }} -m venv .venv

      - name: Activate and install pytest (linux)
        if: runner.os != 'Windows'
        run: |
          source .venv/bin/activate
          python -m pip install pytest
          python -c "import sys;print('python_venv_path=' + sys.executable)" >> $GITHUB_ENV

      - name: Activate and install pytest (windows)
        if: runner.os == 'Windows'
        run: |
          .venv\scripts\activate
          python -m pip install pytest
          python -c "import sys;print('python_venv_path=' + sys.executable)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Echo python_venv_path
        run: |
          echo python_venv_path=${{env.python_venv_path}}

      - name: Run import tests with venv
        env:
          CI_IMPORT_TEST_VENVPATH: '../../'
          CI_IMPORT_TEST_VENV: '.venv'
        run: pnpm run test:imports
        working-directory: packages/pyright-internal

      - name: Run import tests with pythonpath
        env:
          CI_IMPORT_TEST_PYTHONPATH: ${{env.python_venv_path}}
        run: pnpm run test:imports
        working-directory: packages/pyright-internal

  build:
    runs-on: ubuntu-latest
    name: Build
    needs: typecheck
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - uses: ./.github/actions/choose-npm-install

      - run: npm pack --dry-run
        working-directory: packages/pyright

      - run: npm pack --dry-run
        working-directory: packages/pyright-typeserver

      - run: pnpm run package
        working-directory: packages/vscode-pyright

  required:
    runs-on: ubuntu-latest
    name: Required
    needs:
      - typecheck
      - style
      - test
      - build

    steps:
      - run: echo All required jobs succeeded.
