name: Automatically trigger type checker benchmark

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - 'packages/pyright-internal/src/analyzer/**'

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  trigger:
    name: Trigger analyzer benchmark
    if: ${{ github.repository == 'microsoft/pyright' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch benchmark
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issueNumber = context.payload.pull_request.number
            const pullRequest = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issueNumber,
            })
            const candidateSha = pullRequest.data.merge_commit_sha
            if (!candidateSha) {
              core.notice('The pull request does not have a merge commit to benchmark')
              return
            }
            const candidateCommit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: candidateSha,
            })
            const baseSha = candidateCommit.data.parents[0]?.sha
            if (!baseSha || baseSha !== pullRequest.data.base.sha) {
              core.setFailed('The pull request merge commit does not use the current base')
              return
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'typecheck_benchmark_pr.yml',
              ref: context.payload.repository.default_branch,
              inputs: {
                pr_number: String(issueNumber),
                head_sha: pullRequest.data.head.sha,
                base_sha: baseSha,
                merge_sha: candidateSha,
              },
            })
