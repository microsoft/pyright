name: Publish documentation and benchmark

on:
  workflow_call:
    inputs:
      benchmark-run-id:
        description: Workflow run containing the weekly benchmark report artifact
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Publish documentation site
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Download latest benchmark report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: weekly-typecheck-report-*
          path: weekly-report
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ inputs.benchmark-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add report to documentation site
        run: |
          rm -rf docs/typecheck-benchmark
          mkdir -p docs/typecheck-benchmark
          cp -R weekly-report/. docs/typecheck-benchmark/

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
