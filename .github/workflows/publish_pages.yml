name: Publish documentation and benchmark

on:
  workflow_call:
    inputs:
      benchmark-run-id:
        description: Workflow run containing the weekly benchmark report artifact
        required: false
        default: ''
        type: string
      history-run-id:
        description: Workflow run containing the Pyright release history artifact
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  publish:
    name: Publish documentation site
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Find retained report artifacts
        id: reports
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BENCHMARK_RUN_ID: ${{ inputs.benchmark-run-id }}
          HISTORY_RUN_ID: ${{ inputs.history-run-id }}
        with:
          script: |
            const fs = require('fs')

            async function findRun(workflowId, artifactPrefix, required) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                status: 'success',
                per_page: 20,
              })
              for (const run of runs.data.workflow_runs) {
                const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100,
                })
                if (artifacts.data.artifacts.some(
                  (artifact) => !artifact.expired && artifact.name.startsWith(artifactPrefix)
                )) {
                  return String(run.id)
                }
              }
              if (required) core.setFailed(`No retained ${artifactPrefix} artifact was found`)
              return ''
            }

            const benchmarkRunId = process.env.BENCHMARK_RUN_ID ||
              await findRun('typecheck_benchmark_weekly.yml', 'weekly-typecheck-report-', true)
            let historyRunId = process.env.HISTORY_RUN_ID
            if (!historyRunId) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'typecheck_benchmark_history.yml',
                status: 'success',
                per_page: 20,
              })
              for (const run of runs.data.workflow_runs) {
                const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100,
                })
                if (artifacts.data.artifacts.some(
                  (artifact) => !artifact.expired && artifact.name === 'pyright-release-history'
                )) {
                  historyRunId = String(run.id)
                  break
                }
              }
            }
            core.setOutput('benchmark-run-id', benchmarkRunId)
            core.setOutput('history-run-id', historyRunId)

            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            const pattern =
              /^typecheck-benchmark-history-pr-(\d+)-base-[0-9a-f]{40}-candidate-[0-9a-f]{40}$/
            const latestByPullRequest = new Map()
            for (const artifact of artifacts) {
              const match = artifact.name.match(pattern)
              if (!match || artifact.expired || !artifact.workflow_run?.id) continue
              const pullRequestNumber = Number(match[1])
              const existing = latestByPullRequest.get(pullRequestNumber)
              if (
                existing &&
                new Date(existing.created_at) >= new Date(artifact.created_at)
              ) continue
              const run = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: artifact.workflow_run.id,
              })
              if (run.data.path !== '.github/workflows/typecheck_benchmark_trigger.yml') continue
              latestByPullRequest.set(pullRequestNumber, {
                id: artifact.id,
                pr_number: pullRequestNumber,
                created_at: artifact.created_at,
              })
            }
            const retained = [...latestByPullRequest.values()].map(
              ({ id, pr_number }) => ({ id, pr_number })
            )
            fs.writeFileSync(
              'pr-history-artifacts.json',
              `${JSON.stringify(retained)}\n`
            )

      - name: Download latest benchmark report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: weekly-typecheck-report-*
          path: weekly-report
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ steps.reports.outputs.benchmark-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Pyright release history
        if: ${{ steps.reports.outputs.history-run-id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pyright-release-history
          path: release-history
          repository: ${{ github.repository }}
          run-id: ${{ steps.reports.outputs.history-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download retained PR histories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pr-histories
          jq -r '.[] | [.id, .pr_number] | @tsv' pr-history-artifacts.json |
            while IFS=$'\t' read -r artifact_id pr_number; do
              archive="$RUNNER_TEMP/pr-history-$pr_number.zip"
              destination="pr-histories/$pr_number"
              gh api \
                "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
                > "$archive"
              python - "$archive" "$destination" <<'PY'
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          archive_path = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          allowed = {
              "execution-time.svg",
              "history.json",
              "index.html",
              "peak-memory.svg",
          }
          with zipfile.ZipFile(archive_path) as archive:
              files = [info for info in archive.infolist() if not info.is_dir()]
              names = {PurePosixPath(info.filename).name for info in files}
              if names != allowed or any(
                  len(PurePosixPath(info.filename).parts) != 1 for info in files
              ):
                  raise RuntimeError(f"Unexpected PR history archive entries: {sorted(names)}")
              destination.mkdir(parents=True, exist_ok=True)
              for info in files:
                  if info.file_size > 5 * 1024 * 1024:
                      raise RuntimeError(f"PR history file is too large: {info.filename}")
                  (destination / info.filename).write_bytes(archive.read(info))
          PY
            done

      - name: Add report to documentation site
        run: |
          mkdir -p docs/typecheck-benchmark
          find docs/typecheck-benchmark -mindepth 1 -maxdepth 1 ! -name history -exec rm -rf {} +
          cp -R weekly-report/. docs/typecheck-benchmark/
          if [[ -d release-history ]]; then
            rm -rf docs/typecheck-benchmark/history
            cp -R release-history docs/typecheck-benchmark/history
          fi
          if [[ -d pr-histories ]]; then
            rm -rf docs/typecheck-benchmark/pr
            cp -R pr-histories docs/typecheck-benchmark/pr
          fi

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
