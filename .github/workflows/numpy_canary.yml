name: NumPy complexity canary

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/pyright-internal/**'
      - 'packages/pyright/**'
      - 'build/benchmark/canaries/numpy/**'
      - 'build/benchmark/numpyCanary.cjs'
      - '.github/workflows/numpy_canary.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  numpy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.3'
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m venv .numpy-canary-venv
          .numpy-canary-venv/bin/python -m pip install numpy==2.4.6
      - name: Build current core and CLI
        run: |
          pnpm --dir packages/pyright-internal run build
          pnpm run build:cli:dev
      - name: Check work budget and semantic controls
        run: pnpm --dir packages/pyright-internal exec jest --testPathPatterns=protocolRequirementComplexity.test --runInBand --forceExit
      - name: Check NumPy canary
        run: node build/benchmark/numpyCanary.cjs --python "$PWD/.numpy-canary-venv/bin/python"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: numpy-canary
          path: build/benchmark/results/numpy-canary/
          if-no-files-found: warn
