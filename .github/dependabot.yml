version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    groups:
      github-actions:
        patterns: ['*']
    # gh-aw owns this runtime and its generated script calls; upgrade them together.
    ignore:
      - dependency-name: 'github/gh-aw-actions'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
